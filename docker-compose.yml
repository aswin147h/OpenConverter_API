services:
  api:
    build: ./backend
    environment:
      OC_DATA_DIR: /data
      OC_MAX_UPLOAD_BYTES: 20971520
      OC_MAX_PAGES: 30
      OC_RETENTION_SECONDS: 3600
    volumes:
      - openconvert-data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  openconvert-data:
